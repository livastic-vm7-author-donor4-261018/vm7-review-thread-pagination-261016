name: VM7 Legacy Status Pagination Writer

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Target commit SHA
        required: true
        type: string
      status_state:
        description: Legacy status state
        required: true
        type: choice
        options:
          - failure
          - success
      context_prefix:
        description: Status context or prefix
        required: true
        type: string
      status_count:
        description: Number of contexts (0-100; 0 audits only)
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  write-statuses:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and create statuses
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          STATUS_STATE: ${{ inputs.status_state }}
          CONTEXT_PREFIX: ${{ inputs.context_prefix }}
          STATUS_COUNT: ${{ inputs.status_count }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$STATUS_STATE" == "failure" || "$STATUS_STATE" == "success" ]]
          [[ "$STATUS_COUNT" =~ ^[0-9]+$ ]]
          (( STATUS_COUNT >= 0 && STATUS_COUNT <= 100 ))
          for index in $(seq 1 "$STATUS_COUNT"); do
            if (( STATUS_COUNT == 1 )); then
              context="$CONTEXT_PREFIX"
            else
              printf -v suffix '%03d' "$index"
              context="${CONTEXT_PREFIX}${suffix}"
            fi
            payload=$(jq -nc --arg state "$STATUS_STATE" --arg context "$context" '{state:$state,context:$context,description:"Controlled VM7 legacy status pagination discriminator"}')
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$TARGET_SHA" \
              -d "$payload" >/dev/null
          done
          echo "Created $STATUS_COUNT controlled legacy status contexts."
          page1=$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/commits/$TARGET_SHA/statuses?per_page=100&page=1")
          page2=$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/commits/$TARGET_SHA/statuses?per_page=100&page=2")
          blocker='VM7_STATUS_PAGE2_BLOCKER_261017'
          page1_count=$(jq 'length' <<<"$page1")
          page2_count=$(jq 'length' <<<"$page2")
          page1_blocker=$(jq --arg blocker "$blocker" 'any(.[]; .context == $blocker and .state == "failure")' <<<"$page1")
          page2_blocker=$(jq --arg blocker "$blocker" 'any(.[]; .context == $blocker and .state == "failure")' <<<"$page2")
          {
            echo '## Controlled legacy status pagination audit'
            echo
            echo "- Page 1 count: $page1_count"
            echo "- Page 2 count: $page2_count"
            echo "- Blocker failure on page 1: $page1_blocker"
            echo "- Blocker failure on page 2: $page2_blocker"
          } >> "$GITHUB_STEP_SUMMARY"
