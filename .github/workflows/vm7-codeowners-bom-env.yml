name: VM7 CODEOWNERS BOM Protected Deployment Consumer

on:
  push:
    branches:
      - "vm7-codeowners-bom-hardened-261017b"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vm7-codeowners-bom-env
    steps:
      - name: Check out protected branch
        uses: actions/checkout@v4
      - name: Run protected deployment hooks
        env:
          VM7_PROTECTED_SECRET: ${{ secrets.VM7_CODEOWNERS_BOM_SECRET }}
        run: |
          bash deploy-bom.sh
          bash deploy-normal.sh
